<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modals of Deduction - Grade 7</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:linear-gradient(160deg,#1b1464,#3a2a9c 60%,#5b3fc4);color:#222;min-height:100vh;overflow-x:hidden}
.star{position:fixed;color:#ffd54a;animation:tw 2.5s infinite ease-in-out;pointer-events:none;z-index:0}
@keyframes tw{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.3)}}
.wrap{max-width:820px;margin:0 auto;padding:14px;position:relative;z-index:1}
header{text-align:center;color:#fff}
h1{margin:6px 0;font-size:2.2rem;background:linear-gradient(90deg,#ffd54a,#ff9ff3);-webkit-background-clip:text;background-clip:text;color:transparent}
.astro{font-size:3rem;display:inline-block;animation:fl 3s infinite ease-in-out}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-10px) rotate(5deg)}}
.bar{background:#ffffff30;border-radius:20px;height:14px;margin:8px 0;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd54a,#ff7bd5);transition:width .5s}
.score{color:#ffd54a;font-weight:700}
.card{background:#fff;border-radius:22px;padding:16px;margin:16px 0;box-shadow:0 8px 24px #0005;animation:pop .5s}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.qh{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.qt{background:#5b3fc4;color:#fff;padding:6px 18px;border-radius:16px;font-weight:700;font-size:1.2rem}
.mk{background:#ffd6ec;color:#c2185b;padding:4px 12px;border-radius:14px;font-weight:700}
.ins{background:#fff3b0;padding:8px 12px;border-radius:12px;margin:10px 0;font-weight:600}
.para{background:#f5f0ff;border:2px solid #d6c8ff;border-radius:14px;padding:12px;line-height:1.9;font-size:1.08rem}
.gap{display:inline-block;min-width:70px;text-align:center;border-bottom:3px dashed #5b3fc4;color:#5b3fc4;font-weight:700;padding:0 6px;border-radius:6px}
.gap.ok{background:#c8f7d4;color:#127a3a;border-color:#2ecc71}
.gap.no{background:#ffd0d0;color:#b71c1c;border-color:#e74c3c}
.qs{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin-top:12px}
.q{border:2px solid #d6c8ff;border-radius:14px;padding:8px;background:#fbf9ff}
.q.cur{border-color:#ff7bd5;box-shadow:0 0 0 3px #ffd6ec}
.num{background:#ffb300;color:#fff;border-radius:50%;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;margin-bottom:6px}
.opt{display:block;width:100%;text-align:left;margin:4px 0;padding:8px 10px;border:none;border-radius:10px;background:#ffe3f1;font-size:1rem;cursor:pointer;transition:.2s}
.opt:hover:not(:disabled){transform:scale(1.05);background:#ffc8e4}
.opt.ok{background:#2ecc71;color:#fff;animation:bounce .6s}
.opt.no{background:#e74c3c;color:#fff;animation:shake .5s}
.opt:disabled{cursor:default}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.sent{margin:14px 0;padding:10px;border-radius:14px;background:#faf8ff;border:2px solid #e3d9ff}
.slot{min-height:50px;border-bottom:3px dashed #b9a6ff;padding:6px 2px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.w{background:#dcd3ff;color:#1b1464;border:none;padding:8px 14px;border-radius:12px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 3px 0 #b3a2f0;transition:.15s}
.w:hover{transform:translateY(-3px)}
.slot .w{background:#b9f0ff;box-shadow:0 3px 0 #86d6ee}
.fb{font-weight:700;min-height:24px}
.fb.ok{color:#127a3a}.fb.no{color:#c62828}
.act button{border:none;border-radius:12px;padding:8px 16px;font-weight:700;cursor:pointer;margin-right:6px;font-size:.95rem}
.chk{background:#5b3fc4;color:#fff}.clr{background:#ffd54a}.shw{background:#ff7bd5;color:#fff}
.slot.ok{border-color:#2ecc71;background:#e9fff0}.slot.no{border-color:#e74c3c;animation:shake .5s}
.res{display:none;text-align:center;color:#fff;font-size:1.3rem}
.res .big{font-size:4rem;animation:bounce 1s infinite}
.res button{background:#ffd54a;border:none;border-radius:14px;padding:10px 22px;font-weight:700;font-size:1.1rem;cursor:pointer;margin-top:8px}
footer{text-align:center;color:#ffd54a;padding:16px;font-weight:700}
.conf{position:fixed;top:-20px;font-size:1.6rem;animation:fall 3s linear forwards;z-index:9;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="astro">👩‍🚀</div>
<h1>Modals of Deduction</h1>
<div>Grade 7 &nbsp;|&nbsp; Score: <span class="score" id="sc">0</span> / 10</div>
<div class="bar"><i id="pg"></i></div>
</header>

<div class="card">
<div class="qh"><span class="qt">Question 1</span><span class="mk">(5 marks)</span></div>
<div class="ins">Read the paragraph and choose the correct answer to complete each gap.</div>
<div class="para" id="para"></div>
<div class="qs" id="qs"></div>
</div>

<div class="card">
<div class="qh"><span class="qt">Question 2</span><span class="mk">(5 marks)</span></div>
<div class="ins">Rearrange the words to make correct sentences.</div>
<div id="q2"></div>
</div>

<div class="res" id="res"><div class="big" id="emo">🏆</div><div id="msg"></div><button onclick="location.reload()">Play again 🔄</button></div>
<footer>Created by T.Badria Alfalahi ⭐</footer>
</div>

<script>
const $=id=>document.getElementById(id);
for(let i=0;i<25;i++){const s=document.createElement('div');s.className='star';s.textContent='★';s.style.cssText=`left:${Math.random()*100}vw;top:${Math.random()*100}vh;font-size:${8+Math.random()*16}px;animation-delay:${Math.random()*2.5}s`;document.body.appendChild(s)}

let score=0,done=0;
function upd(){$('sc').textContent=score;$('pg').style.width=(done/10*100)+'%';
 if(done==10){setTimeout(()=>{const r=$('res');r.style.display='block';
  $('emo').textContent=score>=9?'🏆':score>=6?'🌟':'💪';
  $('msg').innerHTML=`You scored <b>${score} / 10</b><br>`+(score>=9?'Excellent! You are a deduction star!':score>=6?'Great job! Keep practising!':'Good try! Play again and improve!');
  r.scrollIntoView({behavior:'smooth'});if(score>=6)confetti()},700)}}
function confetti(){const e=['⭐','🎉','🌟','🚀','✨'];for(let i=0;i<40;i++){const c=document.createElement('div');c.className='conf';c.textContent=e[i%5];c.style.left=Math.random()*100+'vw';c.style.animationDelay=Math.random()*1.5+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),5000)}}

/* Question 1 */
const P=["Yesterday, Sara visited a wildlife park. She saw a large animal with a hump. It ","G1"," be a camel because camels have humps. Near the lake, she saw an animal with fins. It ","G2"," be a bird because birds have feathers, not fins. Sara also saw a strange animal behind a tree. It ","G3"," be a fox, but she was not sure. Then, she saw a bird with a sharp beak. It must ","G4"," an eagle because she could see it clearly. Finally, she saw a hedgehog with many spines. It ","G5"," have smooth skin because its back was covered with spines."];
const Q=[["must","might","can't"],["must","can't","may"],["must","might","can't"],["is","be","are"],["must","can't","could"]];
const A=["must","can't","might","be","can't"];
$('para').innerHTML=P.map(t=>/^G\d$/.test(t)?`<span class="gap" id="${t}">(${t[1]}) ____</span>`:t).join('');
$('qs').innerHTML=Q.map((o,i)=>`<div class="q" id="q${i}"><span class="num">${i+1}</span>`+o.map((x,j)=>`<button class="opt" onclick="pick(${i},${j},this)">${'abc'[j]}) ${x}</button>`).join('')+`</div>`).join('');
function pick(i,j,b){
 const g=$('G'+(i+1)),ok=Q[i][j]===A[i];
 if(ok){document.querySelectorAll('#q'+i+' .opt').forEach(x=>x.disabled=true);
  b.classList.add('ok');b.textContent+=' ✔';g.textContent=A[i];g.className='gap ok';
  if(!$('q'+i).dataset.w)score++;done++;upd()}
 else{b.classList.add('no');b.textContent+=' ✘';b.disabled=true;$('q'+i).dataset.w=1;
  g.textContent=Q[i][j];g.className='gap no';
  const left=[...document.querySelectorAll('#q'+i+' .opt:not(:disabled)')];
  if(left.length==1){ // only the correct one left
   }}
 }

/* Question 2 */
const S=[["must","a hump","have","A camel"],["be","It","a bird","might"],["have","A fish","can't","paws"],["dangerous","could","be","The animal"],["spines","have","must","A hedgehog"]];
const K=["A camel must have a hump.","It might be a bird.","A fish can't have paws.","The animal could be dangerous.","A hedgehog must have spines."];
const sh=a=>{let r;do{r=[...a].sort(()=>Math.random()-.5)}while(r.join()==[...a].join());return r};
$('q2').innerHTML=S.map((w,i)=>`<div class="sent" id="s${i}"><span class="num">${i+1}</span>
<div class="bank" id="b${i}">${sh(w).map(x=>`<button class="w" onclick="mv(${i},this)">${x}</button>`).join('')}</div>
<div class="slot" id="sl${i}"></div>
<div class="fb" id="fb${i}"></div>
<div class="act"><button class="chk" onclick="chk(${i})">Check ✔</button><button class="clr" onclick="clr(${i})">Reset ↺</button><button class="shw" onclick="shw(${i})">Show answer 💡</button></div></div>`).join('');
const fin={};
function mv(i,b){if(fin[i])return;const s=$('sl'+i),bk=$('b'+i);(b.parentNode===bk?s:bk).appendChild(b);$('sl'+i).className='slot';$('fb'+i).textContent=''}
function clr(i){if(fin[i])return;[...$('sl'+i).children].forEach(b=>$('b'+i).appendChild(b));$('fb'+i).textContent=''}
function lock(i,ok,txt){fin[i]=1;$('s'+i).querySelectorAll('.w').forEach(b=>b.disabled=true);done++;if(ok)score++;upd()}
function chk(i){if(fin[i])return;const w=[...$('sl'+i).children].map(b=>b.textContent);
 if(w.length<S[i].length){$('fb'+i).className='fb no';$('fb'+i).textContent='Use all the words first! 🤔';return}
 const t=w.join(' ')+'.',f=$('fb'+i);
 if(t===K[i]){$('sl'+i).className='slot ok';f.className='fb ok';f.textContent='✔ Correct! Well done! 🌟';lock(i,true)}
 else{$('sl'+i).className='slot no';f.className='fb no';f.textContent='✘ Not quite. Try again or press "Show answer".';
  setTimeout(()=>$('sl'+i).classList.remove('no'),600)}}
function shw(i){if(fin[i])return;const sl=$('sl'+i),bk=$('b'+i);
 [...sl.children].forEach(b=>bk.appendChild(b));
 K[i].replace('.','').split(' ').reduce((a,x)=>a,0);
 const order=K[i].slice(0,-1);const pool=[...bk.children];
 // match words in order (handles multi-word chunks)
 let rest=order;S[i].forEach(()=>{});
 const chunks=[];let r=order;
 while(r.length){const m=pool.find(b=>!chunks.includes(b)&&r.startsWith(b.textContent));chunks.push(m);r=r.slice(m.textContent.length).trim()}
 chunks.forEach(b=>sl.appendChild(b));
 sl.className='slot ok';$('fb'+i).className='fb ok';$('fb'+i).textContent='💡 '+K[i];lock(i,false)}
</script>
</body>
</html>
